[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-graph-cli"
version = "0.1.0"
description = "Agent-friendly Microsoft Graph requests from the terminal with predictable JSON output."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jannik Reinhard", email = "contact@jannikreinhard.com"}]
keywords = ["microsoft-graph", "microsoft-365", "azure", "cli", "automation"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/JayRHa/MicrosoftGraphCLI"
Repository = "https://github.com/JayRHa/MicrosoftGraphCLI"
Issues = "https://github.com/JayRHa/MicrosoftGraphCLI/issues"

[project.scripts]
msgraph = "microsoft_graph_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
